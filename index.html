<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BondetTrades Gold Pro</title>
<style>
body{background:#000;color:#FFD700;text-align:center;font-family:Arial;margin:0;padding:0}
.top{background:gold;color:#000;padding:20px;font-weight:bold;font-size:24px}
.box{border:2px solid gold;margin:12px;border-radius:12px;padding:10px;background:#111}
button{background:gold;color:#000;padding:14px 28px;border:none;border-radius:8px;font-weight:bold;margin:8px;font-size:16px}
#s{font-weight:bold}
</style>
</head>
<body>
<div class="top">BONDETTRADES.COM - GOLD BOT</div>

<div class="box">
<h3>🤖 BOT: <span id="s" style="color:lime">READY</span></h3>
<p>Gold Pro Auto-Trader</p>
<button onclick="document.getElementById('s').innerText='RUNNING 🟢';alert('Bot Started Trading Gold!')">START BOT</button>
<button onclick="document.getElementById('s').innerText='STOPPED 🔴'">STOP BOT</button>
</div>

<div class="box">
<h3>📈 LIVE GOLD CHART - XAUUSD</h3>
<div id="chart1" style="height:450px"></div>
<script src="https://s.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
"container_id":"chart1",
"symbol":"OANDA:XAUUSD",
"interval":"1",
"theme":"dark",
"style":"1",
"autosize":true
});
</script>
</div>

<div class="box">
<h3>📊 VOLATILITY 75</h3>
<div id="chart2" style="height:400px"></div>
<script>
new TradingView.widget({
"container_id":"chart2",
"symbol":"TVC:DXY",
"interval":"5",
"theme":"dark",
"autosize":true
});
</script>
</div>

</body>
</html>
