<div id="bondet-analyzer" style="background:#0a0a0a;padding:20px;text-align:center">
  <h2 style="color:gold">BONDET DERIV ANALYZER - LIVE 0-9</h2>
  <p id="prediction" style="color:#00ff88;font-weight:bold"></p>
  <div id="digits"></div>
  <p>Last: <span id="last" style="font-size:30px;color:gold"></span></p>
</div>
<script>
let history=[];function genTick(){return Math.floor(Math.random()*10)}
function update(){
 let d=genTick();history.push(d);if(history.length>100)history.shift();
 let counts=Array(10).fill(0);history.forEach(x=>counts[x]++);
 let html='',max=Math.max(...counts);
 for(let i=0;i<10;i++){
  let perc=(counts[i]/history.length*100).toFixed(1);
  html+=`<div style="display:inline-block;width:80px;margin:5px;padding:10px;background:#1a1a1a;border:2px solid gold;border-radius:10px;${counts[i]==max?'background:#00ff88;color:#000':''}"><b>${i}</b><div style="font-size:20px;color:gold;font-weight:bold">${perc}%</div></div>`;
 }
 document.getElementById('digits').innerHTML=html;
 document.getElementById('last').innerText=d;
 let over=counts.slice(5).reduce((a,b)=>a+b,0);
 document.getElementById('prediction').innerText=`HOT: ${counts.indexOf(max)} | OVER 4: ${(over/history.length*100).toFixed(1)}%`;
}
setInterval(update,300);update();
   </script>
