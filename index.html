<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BONDET TRADES</title><style>body{background:#0a0e1a;color:#fff;font-family:Arial;margin:0}.header{background:#1a2332;padding:12px;display:flex;justify-content:space-between}.logo{color:#00ff88;font-weight:bold}.card{background:#162032;margin:12px;border-radius:12px;padding:16px}.run-btn{width:100%;background:linear-gradient(90deg,#00c853,#00e676);padding:16px;border:none;border-radius:10px;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}.log{background:#000;color:#00ff88;padding:10px;font-family:monospace;height:150px;overflow:auto;border-radius:8px}</style></head><body>
<div class="header"><div class="logo">BONDET TRADES</div><div id="balance">Not Connected</div></div>
<div class="card"><b>Quick strategy - Bondet Dollar Printer</b><br>Market: V100 | Even/Odd | Both<br>Loss:1000 Profit:500 Stake:50</div>
<div class="card">
<div>Total Profit: <span id="totalProfit">$0.00</span> | Stake: <span id="currStake">$50</span></div>
<button class="run-btn" id="connectBtn" onclick="connectDeriv()">🔗 CONNECT DERIV & START BOT</button>
<button class="run-btn" id="stopBtn" onclick="stopBot()" style="display:none;background:#ff1744">⛔ STOP BOT</button>
<div class="log" id="logBox">> About To Print Dollar...<br></div>
</div>
<script>
const APP_ID=1089;let ws,token,isRunning=false,totalProfit=0,currentStake=50;
function log(m){document.getElementById('logBox').innerHTML+=`> ${m}<br>`}
function connectDeriv(){window.location.href=`https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}`;}
function init(){const p=new URLSearchParams(location.search);let t=p.get('token1');if(t){localStorage.setItem('deriv_token',t);token=t;document.getElementById('balance').innerText='Connected ✅';document.getElementById('connectBtn').innerText='▶️ RUN BOT';document.getElementById('connectBtn').onclick=startBot;history.replaceState({},'',location.pathname);}}
function startBot(){token=localStorage.getItem('deriv_token');isRunning=true;document.getElementById('connectBtn').style.display='none';document.getElementById('stopBtn').style.display='block';ws=new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);ws.onopen=()=>{ws.send(JSON.stringify({authorize:token}));log('Authorizing...')};ws.onmessage=(e)=>{let d=JSON.parse(e.data);if(d.authorize){log('Authorized! Starting...');placeTrade();}if(d.buy){log(`Bought ${d.buy.contract_id}`);}if(d.proposal_open_contract&&d.proposal_open_contract.is_sold){let prof=parseFloat(d.proposal_open_contract.profit);totalProfit+=prof;document.getElementById('totalProfit').innerText=`$${totalProfit.toFixed(2)}`;if(prof<0){currentStake=Math.min(currentStake*2.1,500);log(`LOSS -> ${currentStake}`)}else{currentStake=50;log(`WIN $${prof}`)}if(isRunning)setTimeout(placeTrade,1000);}}; }
function placeTrade(){let type=Math.random()>0.5?'DIGITEVEN':'DIGITODD';ws.send(JSON.stringify({buy:1,subscribe:1,parameters:{amount:currentStake,basis:'stake',contract_type:type,currency:'USD',duration:1,duration_unit:'t',symbol:'R_100'}}));log(`Placing ${type} $${currentStake}`);}
function stopBot(){isRunning=false;if(ws)ws.close();document.getElementById('connectBtn').style.display='block';document.getElementById('stopBtn').style.display='none';log('Stopped');}
init();
</script></body></html>
